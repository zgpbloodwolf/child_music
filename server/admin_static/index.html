<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>启蒙音频 · 后台管理</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; margin: 0; background: #f5f5f7; color: #222; }
    .tip { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #999; }
  </style>
</head>
<body>
  <!-- 跳板页:登录后直接进入歌曲管理(各管理页自带公共左侧导航栏,见 common.js);
       未登录/会话失效跳登录页。管理模块拆分: songs / categories / members。 -->
  <div class="tip">正在进入后台…</div>

<script>
  // 应用前缀(自动识别 /admin 子路径),适配反代前缀部署
  const BASE = location.pathname.replace(/\/admin\/?$/, "") || "";
  // 登录后的默认落点:歌曲管理(侧边栏可切其他模块)
  const HOME = "/admin/songs";

  // ===== 登录态 =====
  const SESSION_KEY = "admin_session";
  let adminToken = ""; // 空 = 未登录

  function loadSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)) || null; } catch (e) { return null; }
  }
  function clearSession() {
    try { localStorage.removeItem(SESSION_KEY); } catch (e) { /* 忽略 */ }
    adminToken = "";
  }
  function gotoLogin() {
    location.replace(BASE + "/admin/login"); // replace:登录后不留下本页历史
  }

  // 带鉴权的请求;ok 返回解析后数据,失败抛 {detail}
  async function api(path, opts = {}) {
    const headers = { ...(opts.headers || {}) };
    if (adminToken) headers.Authorization = "Bearer " + adminToken;
    const res = await fetch(BASE + path, { ...opts, headers });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      const detail = (data && data.detail) || ("请求失败(" + res.status + ")");
      const err = new Error(detail);
      err.status = res.status;
      err.detail = detail;
      throw err;
    }
    return data;
  }

  // ===== 启动:探测会话,已登录直达歌曲管理,未登录/失效跳登录页 =====
  (async function boot() {
    const saved = loadSession();
    if (saved && saved.token) adminToken = saved.token;
    try {
      const s = await api("/api/admin/session"); // 该接口永不 401
      if (s.authed && adminToken) return location.replace(BASE + HOME);
    } catch (e) { /* 探测失败同样跳登录页,由登录页再探一次 */ }
    if (saved) clearSession(); // 本地令牌已失效(过期/服务端已换账号密码)
    gotoLogin();
  })();
</script>
</body>
</html>
